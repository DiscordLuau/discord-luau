[package]
name = "discord_luau_symphonia"
version = "0.0.1"
edition = "2024"
description = "A C ABI over Symphonia that decodes audio files to 48 kHz stereo f32, or passes Opus packets through, for the discord_luau/symphonia package."
license = "MIT"
repository = "https://github.com/DiscordLuau/discord-luau/tree/main/packages/symphonia/native"
publish = false
autotests = false

[lib]
crate-type = ["cdylib", "rlib"]
test = false
doctest = false

[[test]]
name = "integration"
path = "tests/tests.rs"

[features]
testing = []

[dependencies]
symphonia = { version = "0.6.1", default-features = false, features = ["all", "opt-simd"] }
rubato = "5.0.1"
audioadapter-buffers = "5.2.0"

[dev-dependencies]
discord_luau_symphonia = { path = ".", features = ["testing"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "unwind"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_qualifications = "warn"
unused_lifetimes = "warn"
trivial_numeric_casts = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

use_self = "warn"
too_long_first_doc_paragraph = "warn"
redundant_clone = "warn"
needless_collect = "warn"
or_fun_call = "warn"
needless_pass_by_ref_mut = "warn"
as_ptr_cast_mut = "warn"

undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
unreachable = "warn"
todo = "warn"
exit = "warn"
print_stdout = "warn"
print_stderr = "warn"
dbg_macro = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
mod_module_files = "warn"
clone_on_ref_ptr = "warn"
rc_buffer = "warn"
min_ident_chars = "warn"
doc_paragraphs_missing_punctuation = "warn"
redundant_test_prefix = "warn"
empty_drop = "warn"
empty_structs_with_brackets = "warn"
rest_pat_in_fully_bound_structs = "warn"
semicolon_outside_block = "warn"
unseparated_literal_suffix = "warn"
