name = "discord_luau/symphonia"
version = "0.0.2"
description = "Discord Luau Symphonia - FFI bindings for libsymphonia, decoding audio files to 48 kHz stereo PCM and passing Opus through."
license = "MIT"
authors = ["Async Matrix <hi@asyncmatrix.dev>"]
repository = "https://github.com/DiscordLuau/discord-luau/tree/main/packages/symphonia"
pesde_version = "0.7.0-rc.7"

includes = [
    "src/**/*",
    "pesde.toml",
    "LICENSE",
    "README.md",
    "CONTRIBUTING.md",
    "patches/**/*",
]

[target]
environment = "luau"
lib = "src/init.luau"

[indices]
default = "https://github.com/pesde-pkg/index"

[dependencies]
binary = { workspace = "discord_luau/binary", version = ">=0.0.0" }
logger = { name = "discord_luau/logger", version = ">=0.0.0" }
std_polyfills = { workspace = "discord_luau/std_polyfills", version = ">=0.0.0" }

[overrides]
"binary>std_polyfills,logger>std_polyfills" = "std_polyfills"
