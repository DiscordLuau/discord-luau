name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install tooling
        uses: CompeyDev/setup-rokit@v0.2.1
        with:
          cache: true
      - name: Check formatting
        run: zune run .zune/fmt.luau

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: ["fmt"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install tooling
        uses: CompeyDev/setup-rokit@v0.2.1
        with:
          cache: true
      - name: Lint
        run: zune run .zune/lint.luau
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: ["lint"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install pesde
        uses: lumin-org/setup-pesde@v0.4.1
        with:
          cache: true
          version: v0.7.4+registry.0.2.3
      - name: Install tooling
        uses: CompeyDev/setup-rokit@v0.2.1
        with:
          cache: true
      - name: Setup zune typedefs
        run: zune setup
      - name: Bundle api-types
        run: zune run .zune/bundle.luau
      - name: Install dependencies
        run: pesde install
      - name: Typecheck
        run: zune run .zune/analyze.luau
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: ["typecheck"]
    env:
      DISCORD_LUAU_REQUIRE_FFI: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install pesde
        uses: lumin-org/setup-pesde@v0.4.1
        with:
          cache: true
          version: v0.7.4+registry.0.2.3
      - name: Install tooling
        uses: CompeyDev/setup-rokit@v0.2.1
        with:
          cache: true
      - name: Bundle api-types
        run: zune run .zune/bundle.luau
      - name: Install dependencies
        run: pesde install
      - name: Seed native libraries from this checkout
        run: zune run .github/scripts/seedBinaryCache.luau
      - name: Run unit-tests
        run: zune run .zune/test.luau
      - name: Run the std_polyfills tests on Zune's epoll backend
        run: zune run .zune/test.luau packages/std_polyfills
        env:
          ZUNE_ASYNC_BACKEND: epoll
      - name: Run the audio tests on Zune's epoll backend
        run: zune run .zune/test.luau packages/audio
        env:
          ZUNE_ASYNC_BACKEND: epoll
