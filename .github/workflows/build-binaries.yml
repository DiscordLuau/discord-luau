name: Build native binaries

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Cross-compile libopus, libsodium and libsymphonia
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install the Rust toolchain for Symphonia
        working-directory: packages/symphonia/native
        run: rustup toolchain install
      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --version 0.24.0 --locked
      - name: Build
        run: bash .github/scripts/build-binaries.sh dist
      - name: Write checksums to the summary
        run: |
          {
            echo "### Native binaries"
            echo
            echo "Commit this artifact's files, never a local build, and update the matching \`sys.luau\` checksums; \`binary.load\` downloads from a release tag, so shipping them needs a new tag."
            echo
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: native-binaries
          path: dist/
          if-no-files-found: error
