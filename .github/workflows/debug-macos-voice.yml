name: Debug macOS voice hang

on:
  push:
    branches:
      - debug/macos-voice
  workflow_dispatch:

jobs:
  voice-per-spec:
    name: Voice hang probe (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      DISCORD_LUAU_REQUIRE_FFI: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pesde
        uses: lumin-org/setup-pesde@v0.4.1
        with:
          cache: true
          version: v0.7.4+registry.0.2.3
      - name: Install tooling
        uses: CompeyDev/setup-rokit@v0.2.1
        with:
          cache: true
      - name: Install dependencies
        run: pesde install
      - name: Seed native libraries from this checkout
        run: zune run .github/scripts/seedBinaryCache.luau
      - name: Probe the sender address a UDP reply reports
        run: perl -e 'alarm shift @ARGV; exec @ARGV' 20 zune run .github/debug/udpProbe.luau || echo "probe exit=$?"
      - name: Run the hanging voice specs with the current and the pre-rewrite net.luau
        run: |
          results=""
          held="$RUNNER_TEMP/held-voice-specs"
          netFile=packages/std_polyfills/src/zune/net.luau
          mkdir -p "$held"
          cp "$netFile" "$RUNNER_TEMP/net.current.luau"
          git show 53a3621:$netFile > "$RUNNER_TEMP/net.before.luau"
          for variant in current before; do
            cp "$RUNNER_TEMP/net.$variant.luau" "$netFile"
            for name in udp connection dave errorSurfacing; do
              spec="packages/voice/tests/$name.spec.luau"
              for other in packages/voice/tests/*.spec.luau; do
                if [ "$other" != "$spec" ]; then mv "$other" "$held/"; fi
              done
              echo "::group::$variant $name"
              started=$SECONDS
              set +e
              perl -e 'alarm shift @ARGV; exec @ARGV' 120 zune run .zune/test.luau packages/voice
              code=$?
              set -e
              echo "::endgroup::"
              pkill -f 'zune run' || true
              for other in "$held"/*.spec.luau; do
                if [ -e "$other" ]; then mv "$other" packages/voice/tests/; fi
              done
              results+="$variant $name exit=$code $((SECONDS - started))s"$'\n'
            done
          done
          cp "$RUNNER_TEMP/net.current.luau" "$netFile"
          echo "===== results (exit 142 means killed after 120 s)"
          printf '%s' "$results"
