name: Debug macOS voice hang

on:
  push:
    branches:
      - debug/macos-voice
  workflow_dispatch:

jobs:
  voice-per-spec:
    name: Voice hang probe (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      DISCORD_LUAU_REQUIRE_FFI: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pesde
        uses: lumin-org/setup-pesde@v0.4.1
        with:
          cache: true
          version: v0.7.4+registry.0.2.3
      - name: Install tooling
        uses: CompeyDev/setup-rokit@v0.2.1
        with:
          cache: true
      - name: Install dependencies
        run: pesde install
      - name: Seed native libraries from this checkout
        run: zune run .github/scripts/seedBinaryCache.luau
      - name: The voice UDP spec alone with the original case 4
        run: |
          git show 44220bf:packages/voice/tests/udp.spec.luau > packages/voice/tests/udp.spec.luau
          bash .github/debug/runAlone.sh voice udp 60
          git checkout -- packages/voice/tests/udp.spec.luau
      - name: The voice UDP spec alone with case 4 waiting for its sends
        run: bash .github/debug/runAlone.sh voice udp 60
      - name: Test voice with the fix
        run: |
          perl -e 'alarm shift @ARGV; exec @ARGV' 120 zune run .zune/test.luau packages/voice || echo "voice exit=$?"
          pkill -f 'zune run' || true
      - name: Test audio, traced, run 1
        run: |
          perl -e 'alarm shift @ARGV; exec @ARGV' 300 zune run .zune/test.luau packages/audio || echo "audio exit=$?"
          pkill -f 'zune run' || true
      - name: Test audio, traced, run 2
        run: |
          perl -e 'alarm shift @ARGV; exec @ARGV' 300 zune run .zune/test.luau packages/audio || echo "audio exit=$?"
          pkill -f 'zune run' || true
      - name: Test audio, traced, run 3
        run: |
          perl -e 'alarm shift @ARGV; exec @ARGV' 300 zune run .zune/test.luau packages/audio || echo "audio exit=$?"
          pkill -f 'zune run' || true
