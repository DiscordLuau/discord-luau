name: Debug macOS voice hang

on:
  push:
    branches:
      - debug/macos-voice
  workflow_dispatch:

jobs:
  voice-per-spec:
    name: Voice hang probe (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      DISCORD_LUAU_REQUIRE_FFI: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pesde
        uses: lumin-org/setup-pesde@v0.4.1
        with:
          cache: true
          version: v0.7.4+registry.0.2.3
      - name: Install tooling
        uses: CompeyDev/setup-rokit@v0.2.1
        with:
          cache: true
      - name: Install dependencies
        run: pesde install
      - name: Seed native libraries from this checkout
        run: zune run .github/scripts/seedBinaryCache.luau
      - name: Probe sends and closes on UDP sockets with a receive pending
        run: perl -e 'alarm shift @ARGV; exec @ARGV' 30 zune run .github/debug/udpSendWhileReceiving.luau || echo "probe exit=$?"
      - name: Run the udp and connection voice specs alone, traced
        run: |
          held="$RUNNER_TEMP/held-voice-specs"
          mkdir -p "$held"
          for name in udp connection; do
            spec="packages/voice/tests/$name.spec.luau"
            for other in packages/voice/tests/*.spec.luau; do
              if [ "$other" != "$spec" ]; then mv "$other" "$held/"; fi
            done
            echo "::group::$name"
            set +e
            perl -e 'alarm shift @ARGV; exec @ARGV' 150 zune run .zune/test.luau packages/voice
            code=$?
            set -e
            echo "::endgroup::"
            echo "$name exit=$code (142 means killed after 150 s)"
            pkill -f 'zune run' || true
            for other in "$held"/*.spec.luau; do
              if [ -e "$other" ]; then mv "$other" packages/voice/tests/; fi
            done
          done
