name: Debug macOS voice hang

on:
  push:
    branches:
      - debug/macos-voice
  workflow_dispatch:

jobs:
  voice-per-spec:
    name: Voice hang probe (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      DISCORD_LUAU_REQUIRE_FFI: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pesde
        uses: lumin-org/setup-pesde@v0.4.1
        with:
          cache: true
          version: v0.7.4+registry.0.2.3
      - name: Install tooling
        uses: CompeyDev/setup-rokit@v0.2.1
        with:
          cache: true
      - name: Install dependencies
        run: pesde install
      - name: Seed native libraries from this checkout
        run: zune run .github/scripts/seedBinaryCache.luau
      - name: "Red: the close cases with the first fix (9f49d11), which does not release the turn on close"
        run: |
          git show 9f49d11:packages/std_polyfills/src/zune/net.luau > packages/std_polyfills/src/zune/net.luau
          git show 9f49d11:packages/discord_stub/src/udpServer.luau > packages/discord_stub/src/udpServer.luau
          perl -pi -e 's/test\.case\("a send waiting for its turn when the socket closes/test.focus.case("a send waiting for its turn when the socket closes/' packages/std_polyfills/tests/udp.spec.luau
          perl -pi -e 's/test\.case\("a send waiting for its turn when the server stops/test.focus.case("a send waiting for its turn when the server stops/' packages/discord_stub/tests/udpServer.spec.luau
          bash .github/debug/runAlone.sh std_polyfills udp 60
          bash .github/debug/runAlone.sh discord_stub udpServer 60
          git checkout -- packages/std_polyfills packages/discord_stub
      - name: "Green: the same close cases with this fix"
        run: |
          perl -pi -e 's/test\.case\("a send waiting for its turn when the socket closes/test.focus.case("a send waiting for its turn when the socket closes/' packages/std_polyfills/tests/udp.spec.luau
          perl -pi -e 's/test\.case\("a send waiting for its turn when the server stops/test.focus.case("a send waiting for its turn when the server stops/' packages/discord_stub/tests/udpServer.spec.luau
          bash .github/debug/runAlone.sh std_polyfills udp 60
          bash .github/debug/runAlone.sh discord_stub udpServer 60
          git checkout -- packages/std_polyfills packages/discord_stub
      - name: Test voice with the fix
        run: |
          perl -e 'alarm shift @ARGV; exec @ARGV' 120 zune run .zune/test.luau packages/voice || echo "voice exit=$?"
          pkill -f 'zune run' || true
      - name: Test audio with the fix, first run
        run: |
          perl -e 'alarm shift @ARGV; exec @ARGV' 300 zune run .zune/test.luau packages/audio || echo "audio exit=$?"
          pkill -f 'zune run' || true
      - name: Test audio with the fix, second run
        run: |
          perl -e 'alarm shift @ARGV; exec @ARGV' 300 zune run .zune/test.luau packages/audio || echo "audio exit=$?"
          pkill -f 'zune run' || true
      - name: Test std_polyfills with the fix
        run: |
          perl -e 'alarm shift @ARGV; exec @ARGV' 300 zune run .zune/test.luau packages/std_polyfills || echo "std_polyfills exit=$?"
          pkill -f 'zune run' || true
