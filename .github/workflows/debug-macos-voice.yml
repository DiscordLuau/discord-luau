name: Debug macOS voice hang

on:
  push:
    branches:
      - debug/macos-voice
  workflow_dispatch:

jobs:
  voice-per-spec:
    name: Voice hang probe (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      DISCORD_LUAU_REQUIRE_FFI: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pesde
        uses: lumin-org/setup-pesde@v0.4.1
        with:
          cache: true
          version: v0.7.4+registry.0.2.3
      - name: Install tooling
        uses: CompeyDev/setup-rokit@v0.2.1
        with:
          cache: true
      - name: Install dependencies
        run: pesde install
      - name: Seed native libraries from this checkout
        run: zune run .github/scripts/seedBinaryCache.luau
      - name: "Red: the new overlap cases with the fix's source files reverted"
        run: |
          git show 44220bf:packages/std_polyfills/src/zune/net.luau > packages/std_polyfills/src/zune/net.luau
          git show 44220bf:packages/discord_stub/src/udpServer.luau > packages/discord_stub/src/udpServer.luau
          bash .github/debug/runAlone.sh std_polyfills udp 120
          perl -pi -e 's/test\.case\("sends that overlap all return/test.focus.case("sends that overlap all return/' packages/discord_stub/tests/udpServer.spec.luau
          bash .github/debug/runAlone.sh discord_stub udpServer 120
          git checkout -- packages/std_polyfills/src/zune/net.luau packages/discord_stub/src/udpServer.luau packages/discord_stub/tests/udpServer.spec.luau
      - name: "Green: the same cases with the fix"
        run: |
          bash .github/debug/runAlone.sh std_polyfills udp 120
          perl -pi -e 's/test\.case\("sends that overlap all return/test.focus.case("sends that overlap all return/' packages/discord_stub/tests/udpServer.spec.luau
          bash .github/debug/runAlone.sh discord_stub udpServer 120
          git checkout -- packages/discord_stub/tests/udpServer.spec.luau
      - name: Test voice with the fix
        run: |
          perl -e 'alarm shift @ARGV; exec @ARGV' 600 zune run .zune/test.luau packages/voice || echo "voice exit=$?"
          pkill -f 'zune run' || true
      - name: Test audio with the fix
        run: |
          perl -e 'alarm shift @ARGV; exec @ARGV' 900 zune run .zune/test.luau packages/audio || echo "audio exit=$?"
          pkill -f 'zune run' || true
      - name: Test std_polyfills with the fix
        run: |
          perl -e 'alarm shift @ARGV; exec @ARGV' 300 zune run .zune/test.luau packages/std_polyfills || echo "std_polyfills exit=$?"
          pkill -f 'zune run' || true
