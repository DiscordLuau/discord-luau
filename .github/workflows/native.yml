name: Native libraries

on:
  pull_request:
    paths:
      - "packages/binary/**"
      - "packages/dave/**"
      - "packages/opus/**"
      - "packages/sodium/**"
      - "packages/symphonia/**"
      - "packages/audio/**"
      - "packages/std_polyfills/**"
      - ".zune/**"
      - "pesde.toml"
      - "pesde.lock"
      - "rokit.toml"
      - ".github/workflows/native.yml"
      - ".github/scripts/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-tags:
    name: Release tags serve the expected binaries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check every platform's binary against its release tag
        run: bash .github/scripts/check-binary-tags.sh
      - name: Check that a version older than an existing tag fails
        run: |
          if output=$(bash .github/scripts/check-binary-tags.sh --version opus=0.0.0 opus); then
            echo "$output"
            echo "check-binary-tags.sh accepted opus 0.0.0, which is older than every opus tag and has none of its own"
            exit 1
          fi
          echo "$output"
          if echo "$output" | grep -q "could not read tags"; then
            echo "the failure came from reading tags, not from the version rule"
            exit 1
          fi
          if ! echo "$output" | grep -q "FAIL opus .*could not download .*/opus-0.0.0/"; then
            echo "the expected opus-0.0.0 download failure is missing"
            exit 1
          fi
          echo "check-binary-tags.sh rejected opus 0.0.0 as expected"

  load-native-libraries:
    name: Load native libraries (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-linux-gnu.2.17
            exe: ""
          - name: windows-x86
            os: windows-latest
            target: x86-windows-gnu
            exe: ".exe"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Zig
        uses: mlugg/setup-zig@v2.2.1
        with:
          version: 0.16.0
      - name: Build the loader
        run: zig cc -target ${{ matrix.target }} -O2 -o loadNative${{ matrix.exe }} .github/scripts/loadNative.c -lm
      - name: Load libopus, libsodium and libsymphonia
        run: ./loadNative${{ matrix.exe }} .

  test:
    name: Native tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      DISCORD_LUAU_REQUIRE_FFI: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install pesde
        uses: lumin-org/setup-pesde@v0.4.1
        with:
          cache: true
          version: v0.7.4+registry.0.2.3
      - name: Install tooling
        uses: CompeyDev/setup-rokit@v0.2.1
        with:
          cache: true
      - name: Install dependencies
        run: pesde install
      - name: Seed native libraries from this checkout
        run: zune run .github/scripts/seedBinaryCache.luau
      - name: Test binary
        run: zune run .zune/test.luau packages/binary
      - name: Test sodium
        run: zune run .zune/test.luau packages/sodium
      - name: Test opus
        run: zune run .zune/test.luau packages/opus
      - name: Test dave
        run: zune run .zune/test.luau packages/dave
      - name: Test symphonia
        run: zune run .zune/test.luau packages/symphonia
      - name: Test audio
        run: zune run .zune/test.luau packages/audio

  symphonia-unit-tests:
    name: Symphonia native unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/symphonia/native
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install the Rust toolchain
        run: rustup toolchain install
      - name: Run the unit tests
        run: cargo test --locked
